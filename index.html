<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Review</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2317181b'/><path d='M12 9l11 7-11 7z' fill='%233fd3b9'/></svg>" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: #0b0c0e; color: #e8e9ee; font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .card { width: 100%; max-width: 420px; text-align: center; }
    .logo { width: 44px; height: 44px; margin: 0 auto 18px; border-radius: 11px; background: #17181b; display: grid; place-items: center; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { margin: 0; color: #9a9da8; }
    .spin { width: 18px; height: 18px; margin: 18px auto 0; border-radius: 50%; border: 2px solid #34363e; border-top-color: #3fd3b9; animation: s 0.8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    .off { display: none; margin-top: 18px; padding: 14px; border: 1px solid #34363e; border-radius: 10px; background: #16171b; }
    .off strong { display: block; margin-bottom: 4px; color: #e8e9ee; }
    button { margin-top: 12px; padding: 7px 14px; border: 0; border-radius: 7px; background: #3fd3b9; color: #0b0c0e; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="#3fd3b9"/></svg></div>
    <h1>Review</h1>
    <p id="msg">Connexion à la vidéo…</p>
    <div class="spin" id="spin"></div>
    <div class="off" id="off">
      <strong>Review est hors ligne pour le moment.</strong>
      <p>L’ordinateur qui héberge les vidéos est éteint ou en veille. Cette page réessaie toute seule ; vous pouvez aussi revenir plus tard avec le même lien.</p>
      <button id="retry" type="button">Réessayer maintenant</button>
    </div>
  </main>
  <script>
    // Redirection vers l'adresse actuelle de Review (publiée automatiquement dans url.json).
    // Liens acceptés : …/review/#r=<token> (relecture) ou …/review/ (espace équipe).
    const params = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
    const token = params.get('r');
    const validToken = token && /^[A-Za-z0-9_-]{43}$/.test(token);
    const $ = (id) => document.getElementById(id);
    if (token && !validToken) $('msg').textContent = 'Ce lien de relecture est incomplet. Vérifiez qu’il a été copié en entier.';

    const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('délai')), ms))]);
    let timer;

    async function go() {
      clearTimeout(timer);
      $('spin').style.display = 'block';
      try {
        const res = await withTimeout(fetch('url.json?t=' + Date.now(), { cache: 'no-store' }), 8000);
        const { url } = await res.json();
        if (!/^https:\/\/[a-z0-9.-]+$/.test(url)) throw new Error('adresse invalide');
        // vérifie que Review répond vraiment avant de rediriger
        const ok = await withTimeout(fetch(url + '/api/auth/status', { cache: 'no-store' }), 8000);
        if (!ok.ok) throw new Error('hors ligne');
        location.replace(validToken ? url + '/r/' + token : url + '/');
      } catch (e) {
        $('spin').style.display = 'none';
        $('msg').textContent = '';
        $('off').style.display = 'block';
        timer = setTimeout(go, 20000);
      }
    }
    $('retry').addEventListener('click', () => { $('off').style.display = 'none'; $('msg').textContent = 'Connexion à la vidéo…'; go(); });
    if (!token || validToken) go();
  </script>
</body>
</html>
