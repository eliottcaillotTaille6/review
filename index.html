<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Review</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2317181b'/><path d='M12 9l11 7-11 7z' fill='%233fd3b9'/></svg>" />
  <script>
    // Review a déménagé dans le hub Taille 6. Les anciens liens restent valables :
    //   …/review/            → https://taille6-hub.vercel.app/review/
    //   …/review/#r=<token>  → https://taille6-hub.vercel.app/review/r/<token>
    (function () {
      var HUB = 'https://taille6-hub.vercel.app/review';
      var p = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
      var t = p.get('r');
      location.replace(t && /^[A-Za-z0-9_-]{43}$/.test(t) ? HUB + '/r/' + t : HUB + '/');
    })();
  </script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #0b0c0e; color: #9a9da8;
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    a { color: #3fd3b9; }
  </style>
</head>
<body>
  <p>Review a déménagé dans le hub Taille 6.<br /><a href="https://taille6-hub.vercel.app/review/">Ouvrir Review</a></p>
</body>
</html>
